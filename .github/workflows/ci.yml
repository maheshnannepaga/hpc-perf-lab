name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Test
        run: make test

      - name: Kernel correctness with sanitizers
        run: |
          g++ -O1 -g -std=c++20 -Wall -Wextra -Wpedantic -fsanitize=address,undefined tests/gemm_correctness.cpp -o bin/gemm_correctness
          ./bin/gemm_correctness
      - name: CLI verification regression tests (serial build)
        run: python3 tests/test_cli_verification.py bin/gemm_bench
      - name: Baseline collector tests
        run: python3 -m unittest discover -s scripts -p test_collect_baseline.py
